variables:
  PHLOWER_IMAGE_VERSION: 1.2.0
  PHLOWER_IMAGE_REGISTRY: registry.ritc.jp/ricos/machine_learning/phlower
  GIT_STRATEGY: fetch
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_DEPTH: 0

  # see: https://docs.astral.sh/uv/guides/integration/gitlab/
  # GitLab CI creates a separate mountpoint for the build directory,
  # so we need to copy instead of using hard links.
  UV_LINK_MODE: copy

stages:
  - check_system
  - test
  - document_test
  - deploy

default:
  image: ${PHLOWER_IMAGE_REGISTRY}:${PHLOWER_IMAGE_VERSION}-py312-cpu
  before_script:
    - tar -xzf venv.tar.gz || true


check_system:
  stage: check_system
  script:
    - make install CUDA_TAG="cpu" GRAPHLOW_TAG="" PYTHON_VERSION="3.12"
    - make show_system
  tags:
    - no-gpu
  dependencies: []


lint:
  stage: test
  script:
    - make install CUDA_TAG="cpu" GRAPHLOW_TAG="" PYTHON_VERSION="3.12"
    - make lint
  tags:
    - no-gpu
  dependencies: []

pytest_with_py312:
  stage: test
  script:
    - make install CUDA_TAG="cpu"
    - make test
    - uv run coverage html -d coverage
    - uv run coverage xml
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    expose_as: coverage
    paths:
      - coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  tags:
    - no-gpu
    - GenuineIntel
  dependencies: []


pytest_with_py311:
  stage: test
  image: ${PHLOWER_IMAGE_REGISTRY}:${PHLOWER_IMAGE_VERSION}-py311-cpu
  script:
    - make install CUDA_TAG="cpu" GRAPHLOW_TAG="" PYTHON_VERSION="3.11"
    - make test
  dependencies: []


e2e_test:
  image: ${PHLOWER_IMAGE_REGISTRY}:${PHLOWER_IMAGE_VERSION}-py312-cu124
  stage: test
  variables:
    NCCL_DEBUG: "INFO"
  script:
    - make install CUDA_TAG="cu124"
    - uv run python3 -c "import torch; print(torch.cuda.get_arch_list())"
    - make e2e_test
  tags:
    - multi-gpu
    - GenuineIntel
    - sm_75
  dependencies: []

gpu_test:
  image: ${PHLOWER_IMAGE_REGISTRY}:${PHLOWER_IMAGE_VERSION}-py312-cu124
  stage: test
  variables:
    NCCL_DEBUG: "INFO"
  script:
    - make install CUDA_TAG="cu124"
    - make gpu_test
  tags:
    - multi-gpu
    - GenuineIntel
    - sm_75
  dependencies: []

examples:
  image: ${PHLOWER_IMAGE_REGISTRY}:${PHLOWER_IMAGE_VERSION}-py312-cu124
  stage: test
  script:
    - make install CUDA_TAG="cu124"
    - uv run python3 -c "import torch; print(torch.cuda.get_arch_list())"
    - make examples
  tags:
    - gpu
    - GenuineIntel
    - sm_75
  dependencies: []

pages_test:
  stage: document_test
  script:
    - make install CUDA_TAG="cpu" GRAPHLOW_TAG="" PYTHON_VERSION="3.12"
    - uv sync --extra cpu --group docs
    - make document
  tags:
    - no-gpu
    - GenuineIntel
  artifacts:
    paths:
      - docs/build/html/
  dependencies: []

pages:
  stage: deploy
  script:
    - make install CUDA_TAG="cpu" GRAPHLOW_TAG="" PYTHON_VERSION="3.12"
    - mkdir public
    - cp -r docs/build/html/* public/
  artifacts:
    paths:
      - public
  needs:
    - job: pages_test
      artifacts: true
  only:
    - main
    - develop
    - fix_sphinx

.deploy:wheel:
  stage: deploy
  script:
    - uv version $VERSION
    - uv build
    - uv publish --username __token__ --password $PYPI_PUBLISH_TOKEN -n -v


deploy:wheel:tags:
  image: python:3.11-slim
  extends: .deploy:wheel
  before_script:
    - pip install uv
    - export VERSION=$CI_COMMIT_REF_NAME
  only:
    - tags

