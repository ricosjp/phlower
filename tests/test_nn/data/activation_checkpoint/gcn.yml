


model:
  inputs:
    - name: x
      members:
        - name: x
          n_last_dim: 2

  fields:
    - name: gx
    
  network:
    nn_type: GROUP
    name: GROUP1
    inputs:
      - name: x
        n_last_dim: 2
    
    modules:
      - nn_type: GCN
        name: graph
        checkpoint: {{checkpoint}}
        no_grad: {{no_grad|default(false)}}
        input_keys: [x]
        output_key: y
        nn_parameters:
          nodes: [2, 2]
          support_name: gx
          activations: [tanh]
