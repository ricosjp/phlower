misc:

  tests:
    MLP0:
      nodes: [12, 20, 10]
      linear_init: null
    MLP1:
      nodes: [10, 20, 30]
      linear_init:
        kind: xavier_uniform
        init_parameters:
          gain: 1.5
        zero_bias: false
    MLP2:
      nodes: [30, 20, 5]
      linear_init:
        kind: truncated_normal
        init_parameters:
          std: 0.02
        zero_bias: true

model:
  inputs:
    - name: feature0
      members:
        - name: feature0
          n_last_dim: 10

    - name: feature1
      members:
        - name: feature1
          n_last_dim: 12

  network:
    nn_type: GROUP
    name: SAMPLE_MODEL
    inputs:
      - name: feature0
        n_last_dim: 10
      - name: feature1
        n_last_dim: 12
    
    outputs:
      - name: out_feature0
        n_last_dim: 5
    
    modules:
      - nn_type: MLP
        name: MLP0
        input_keys:
          - feature1
        output_key: mlp0
        destinations:
          - MLP1
        nn_parameters:
          nodes: [-1, 20, 10]
          activations: ["identity", "identity"]

      - nn_type: MLP
        name: MLP1
        input_keys:
          - mlp0
        output_key: mlp1
        destinations:
          - MLP2
        nn_parameters:
          nodes: [-1, 20, 30]
          linear_init:
            kind: xavier_uniform
            init_parameters:
              gain: 1.5
            zero_bias: false

      - nn_type: MLP
        name: MLP2
        input_keys:
          - mlp1
        output_key: out_feature0
        nn_parameters:
          nodes: [-1, 20, 5]
          linear_init:
            kind: truncated_normal
            init_parameters:
              std: 0.02
            zero_bias: true
